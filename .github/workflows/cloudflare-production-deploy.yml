name: Cloudflare production deploy (after quality gate)

on:
  # Deploy only after the quality gate succeeds. A simultaneous push trigger caused
  # duplicate production deployments and endpoint probes, which can trip Cloudflare rate limits.
  workflow_run:
    workflows: ["quality-gate"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilotstack-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Build and deploy verified master to Cloudflare
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    steps:
      - name: Checkout verified master commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run required content and SEO gates before deploy
        run: |
          npm test
          npm run lint:content
          npm run audit:guides
          npm run seo:audit
          npm run audit:noindex

      - name: Install Cloudflare tooling in an isolated temporary directory
        run: |
          set -euo pipefail
          mkdir -p /tmp/pilotstack-cloudflare-tools
          printf '%s\n' '{"private":true}' > /tmp/pilotstack-cloudflare-tools/package.json
          npm install --prefix /tmp/pilotstack-cloudflare-tools --no-save --package-lock=false --legacy-peer-deps @opennextjs/cloudflare@1.20.13 wrangler@4.134.0
          mkdir -p node_modules/@opennextjs
          test ! -e node_modules/@opennextjs/cloudflare
          test ! -e node_modules/wrangler
          ln -s /tmp/pilotstack-cloudflare-tools/node_modules/@opennextjs/cloudflare node_modules/@opennextjs/cloudflare
          ln -s /tmp/pilotstack-cloudflare-tools/node_modules/wrangler node_modules/wrangler
          ln -s /tmp/pilotstack-cloudflare-tools/node_modules/.bin/opennextjs-cloudflare node_modules/.bin/opennextjs-cloudflare
          ln -s /tmp/pilotstack-cloudflare-tools/node_modules/.bin/wrangler node_modules/.bin/wrangler

      - name: Build Cloudflare Worker
        run: |
          node scripts/generate-search-index.mjs
          ./node_modules/.bin/opennextjs-cloudflare build
        env:
          BUILD_TARGET: cloudflare
          CI: "true"

      - name: Populate prerender cache
        run: ./node_modules/.bin/opennextjs-cloudflare populateCache local --config wrangler.production.jsonc
        env:
          BUILD_TARGET: cloudflare
          CI: "true"

      - name: Deploy Worker
        run: ./node_modules/.bin/wrangler deploy --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Purge stale Cloudflare edge cache after deployment
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          zone_id="${CLOUDFLARE_ZONE_ID:-}"
          if [ -z "$zone_id" ]; then
            zone_response="$(curl --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones?name=pilotstack.online&status=active" || true)"
            zone_id="$(printf '%s' "$zone_response" | jq -r '.result[0].id // empty' 2>/dev/null || true)"
          fi
          if [ -z "$zone_id" ]; then
            # Non-secret Cloudflare zone ID verified for pilotstack.online. This fallback
            # lets the authenticated purge endpoint run without Zone:Read permission.
            zone_id="815a67bf4ddf51f3c4e1508d15176071"
            echo "::notice::Using the verified PilotStack zone ID fallback for cache purge."
          fi
          purge_response="$(curl --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache" || true)"
          if ! printf '%s' "$purge_response" | jq -e '.success == true' >/dev/null 2>&1; then
            echo "::warning::Cloudflare cache purge failed. Check Zone Cache Purge permission. Canonical endpoint probes will still run but cannot certify that edge-cached HTML is from the new deploy."
            exit 0
          fi
          echo "PASS Cloudflare edge cache purge confirmed"
          sleep 5

      - name: Verify production endpoints
        run: |
          set -euo pipefail
          fetch_status() {
            local url="$1" output="$2" code attempt
            for attempt in 1 2 3 4 5; do
              code="$(curl --silent --show-error --location --output "$output" --write-out '%{http_code}' --connect-timeout 15 --max-time 45 "$url" || true)"
              if [ "$code" = "200" ]; then printf '%s' "$code"; return 0; fi
              if ! [[ "$code" =~ ^(000|408|429|5[0-9][0-9])$ ]]; then printf '%s' "$code"; return 0; fi
              echo "::warning::Transient HTTP ${code:-000} for $url on attempt $attempt; retrying canonical URL" >&2
              sleep $((attempt * 5))
            done
            printf '%s' "${code:-000}"
            return 0
          }
          for path in / /ads.txt /robots.txt /sitemap.xml /privacy /methodology /contact /terms /cookies /editorial-policy /advertising-disclosure /affiliate-disclosure /dmca /fact-checking-policy /corrections-policy; do
            code="$(fetch_status "https://pilotstack.online$path" /tmp/pilotstack-response)"
            printf '%s %s\n' "$code" "$path"
            test "$code" = "200"
            sleep 1
          done
          grep -F 'google.com, pub-6523926892521982, DIRECT, f08c47fec0942fa0' /tmp/pilotstack-response >/dev/null || curl --silent --show-error --fail --retry 4 --retry-all-errors --retry-delay 5 https://pilotstack.online/ads.txt | grep -F 'google.com, pub-6523926892521982, DIRECT, f08c47fec0942fa0'
          contact_html="$(curl --silent --show-error --fail --retry 3 --retry-all-errors --retry-delay 2 https://pilotstack.online/contact)"
          printf '%s' "$contact_html" | grep -Fq 'contact@pilotstack.online' || {
            echo "Configured contact inbox missing from live contact page"
            exit 1
          }
          if printf '%s' "$contact_html" | grep -Eiq 'hello@pilotstack\.online|newsletter@pilotstack\.online|support@pilotstack\.online'; then
            echo "Legacy or placeholder inbox still present on live contact page"
            exit 1
          fi
          echo "PASS live contact page uses only the configured contact inbox"
          # Probe the normal crawlable canonical URLs; query-string cache busting
          # can force expensive runtime rendering and exceed the free Worker CPU
          # budget on a cache miss. New code was already verified before deploy.
          for review in xero notion chatgpt; do
            code="$(fetch_status "https://pilotstack.online/reviews/$review" "/tmp/pilotstack-$review.html")"
            printf '%s %s\n' "$code" "/reviews/$review"
            test "$code" = "200"
            sleep 1
          done
          grep -Fq 'Create a customer invoice, record a supplier bill' /tmp/pilotstack-xero.html
          grep -Fq 'Notion is a candidate to evaluate for documentation, knowledge bases' /tmp/pilotstack-notion.html
          grep -Fq 'An editorial overview of ChatGPT' /tmp/pilotstack-chatgpt.html
          if grep -Eiq 'over 4 million subscribers|160\+ currencies|70-85% of transactions|12-24 hours on the Starter tier' /tmp/pilotstack-xero.html; then
            echo "Stale or unsupported Xero claims detected in live HTML"
            exit 1
          fi
          if grep -Eiq '100,000,000\+|500,000\+ members|3,000\+ apps|4\.7/5 rating' /tmp/pilotstack-notion.html; then
            echo "Stale or unsupported Notion claims detected in live HTML"
            exit 1
          fi
          echo "PASS live review content checks: Xero and Notion"
          # production-smoke-check.cjs intentionally defaults to localhost and is for local runs;
          # the live production endpoints above are already checked here. Do not invoke the local-only
          # smoke script in this deployment job, where no localhost server is running.

      # The full rendered link crawler deliberately refuses production unless explicitly
      # opted in, and crawling ~2,000 URLs at its safety rate would exceed this deploy job.
      # Required static SEO/link gates already ran before build; run production URL smoke checks above.
      - name: Record production link-audit handoff
        run: |
          echo "PASS static SEO audit completed before deployment."
          echo "Full rendered internal-link audit is kept out of production deploy to avoid a high-volume crawl."
          echo "Run scripts/linking-audit.js against a local build or preview environment for full crawl results."
