name: PilotStack full sitemap route audit

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Canonical production origin to audit"
        required: true
        default: "https://pilotstack.online"
        type: string

permissions:
  contents: read

concurrency:
  group: pilotstack-sitemap-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit every same-origin page URL in nested sitemaps
        env:
          SITE_URL: ${{ inputs.site_url }}
          CHECK_SITEMAP_URLS: "1"
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/production-smoke-check.cjs
