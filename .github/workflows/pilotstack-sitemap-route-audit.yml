name: PilotStack full sitemap route audit

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Canonical production origin to audit"
        required: true
        default: "https://pilotstack.online"
        type: string
  workflow_run:
    workflows: ["Cloudflare production deploy (after quality gate)"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pilotstack-sitemap-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit every same-origin page URL in nested sitemaps
        env:
          SITE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.site_url || 'https://pilotstack.online' }}
          CHECK_SITEMAP_URLS: "1"
          # This dedicated, throttled audit is explicitly allowed to crawl the production sitemap.
          ALLOW_LIVE_AUDIT: "1"
          GITHUB_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          AUDIT_OUTPUT_FILE: sitemap-route-audit-report.json
        run: node scripts/production-smoke-check.cjs
      - name: Upload complete route audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilotstack-sitemap-route-audit-${{ github.run_id }}
          path: sitemap-route-audit-report.json
          if-no-files-found: warn
          retention-days: 14
