name: Temporary Next.js security dependency refresh

on:
  push:
    branches:
      - fix/nextjs-critical-security-2026-10-23

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.event.head_commit.message == 'TEMP: prepare Next security bump'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security-fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/nextjs-critical-security-2026-10-23
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update patched Next.js and lockfile
        run: |
          npm install --save-exact next@16.4.3 eslint-config-next@16.4.2
          npm audit fix
          npm audit --omit=dev --json > /tmp/production-audit.json || true
          node -e "const a=require('/tmp/production-audit.json'); console.log('Production audit:', JSON.stringify(a.metadata?.vulnerabilities || {}))"

      - name: Remove temporary workflow and commit lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/temporary-next-security-bump.yml
          git diff --cached --check
          git commit -m "Patch critical Next.js dependency vulnerability"
          git push origin HEAD:fix/nextjs-critical-security-2026-10-23
