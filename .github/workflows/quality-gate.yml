name: quality-gate

permissions:
  contents: write

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit summary (non-blocking)
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const report = require('/tmp/npm-audit.json')
          const vulnerabilities = Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            range: item.range,
            fixAvailable: item.fixAvailable,
            advisories: (item.via || []).filter((via) => typeof via === 'object').map((via) => ({
              title: via.title,
              url: via.url,
              range: via.range,
            })),
          }))
          console.log(JSON.stringify({
            summary: report.metadata?.vulnerabilities,
            affectedPackages: vulnerabilities,
          }, null, 2))
          NODE

      - name: Normalize flagged content boilerplate
        run: |
          node scripts/content-quality-cleanup.js
          git diff --exit-code -- content _gen-expand.js _gen-comparisons.js _gen-best-expansion.js


      - name: Content quality lint
        run: npm run lint:content

      - name: Run guide quality audit
        run: npm run audit:guides

      - name: SEO content audit
        run: npm run seo:audit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
