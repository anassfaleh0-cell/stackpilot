name: quality-gate

permissions:
  contents: read

on:
  push:
    branches: [master, "fix/comparison-copy-audit-wave1"]
  pull_request:

concurrency:
  group: quality-gate-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit summary (non-blocking)
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          npm audit --omit=dev --json > /tmp/npm-audit-production.json || true
          node <<'NODE'
          const full = require('/tmp/npm-audit.json')
          const production = require('/tmp/npm-audit-production.json')
          const vulnerabilities = Object.entries(full.vulnerabilities || {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            range: item.range,
            fixAvailable: item.fixAvailable,
            advisories: (item.via || []).filter((via) => typeof via === 'object').map((via) => ({
              title: via.title,
              url: via.url,
              range: via.range,
            })),
          }))
          console.log(JSON.stringify({
            fullAudit: full.metadata?.vulnerabilities,
            productionAudit: production.metadata?.vulnerabilities,
            affectedPackages: vulnerabilities,
            productionAffectedPackages: Object.entries(production.vulnerabilities || {}).map(([name, item]) => ({
              name, severity: item.severity, range: item.range,
            })),
          }, null, 2))
          NODE

      - name: Normalize flagged content boilerplate
        run: |
          node scripts/content-quality-cleanup.js
          git diff --exit-code -- content _gen-expand.js _gen-comparisons.js _gen-best-expansion.js


      - name: Content quality lint
        run: npm run lint:content

      - name: Use-case content integrity audit
        run: npm run audit:use-cases

      - name: Run guide quality audit
        run: npm run audit:guides

      - name: SEO content audit
        run: npm run seo:audit

      - name: Review/comparison integrity audit (report-only)
        run: npm run audit:review-comparison

      - name: Noindex audit review-candidate generation
        run: npm run audit:noindex

      # Do not hit production on every push/PR: the full-site checks can compete
      # with Googlebot and real visitors. Run this diagnostic only by manual dispatch.
      - name: Production endpoint smoke check (manual diagnostic only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm run seo:smoke
        env:
          SITE_URL: https://pilotstack.online
          ALLOW_LIVE_AUDIT: "1"
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Smoke-test built production routes and SEO metadata
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/pilotstack-next.log 2>&1 &
          echo $! > /tmp/pilotstack-next.pid
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/ads.txt > /dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --silent --fail http://127.0.0.1:3000/ads.txt > /dev/null; then
            cat /tmp/pilotstack-next.log
            echo "Production server did not become ready"
            exit 1
          fi
          node scripts/route-smoke-check.js

      # Live link audit runs after deployment. Before deployment, pilotstack.online can
      # still serve the previous commit, so making it a blocking gate creates a circular dependency.
        timeout-minutes: 6
