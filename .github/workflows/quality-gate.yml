name: quality-gate

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize flagged content boilerplate
        run: |
          node scripts/content-quality-cleanup.js
          git diff --exit-code -- content _gen-expand.js _gen-comparisons.js _gen-best-expansion.js

      - name: Content quality lint
        run: npm run lint:content

      - name: Run guide quality audit
        run: npm run audit:guides

      - name: SEO content audit
        run: npm run seo:audit

      - name: WordPress migration inventory regression tests
        run: node scripts/test-wordpress-migration-inventory.mjs

      - name: WordPress migration URL reconciliation regression tests
        run: node scripts/test-reconcile-wordpress-migration-urls.mjs

      - name: Comparison integrity audit heuristic tests
        run: node scripts/test-audit-comparison-integrity.mjs

      - name: Comparison integrity audit report (read-only)
        run: |
          node scripts/audit-comparison-integrity.mjs > comparison-integrity-report.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("comparison-integrity-report.json", "utf8"));
          const summary = [
            "## Comparison integrity audit (read-only)",
            "",
            `- Comparison records scanned: **${report.filesScanned}**`,
            `- Records marked \`published: false\`: **${report.publishedFalseCount}**`,
            `- Invalid JSON records: **${report.invalidJsonCount}**`,
            `- Heuristic flags: **${report.issueCount}**`,
            "",
            "Flags are review candidates, not proof of defects. Full report is attached as a workflow artifact."
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + "\n");
          console.log(summary);
          NODE

      - name: Upload comparison integrity audit report
        uses: actions/upload-artifact@v4
        with:
          name: comparison-integrity-audit
          path: comparison-integrity-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Smoke-test built production routes and SEO metadata
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/pilotstack-next.log 2>&1 &
          echo $! > /tmp/pilotstack-next.pid
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/ads.txt > /dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --silent --fail http://127.0.0.1:3000/ads.txt > /dev/null; then
            cat /tmp/pilotstack-next.log
            echo "Production server did not become ready"
            exit 1
          fi
          node scripts/route-smoke-check.js
