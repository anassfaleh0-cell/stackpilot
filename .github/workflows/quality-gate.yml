name: quality-gate

permissions:
  contents: write

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize flagged content boilerplate
        run: |
          node scripts/content-quality-cleanup.js
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content _gen-expand.js _gen-comparisons.js _gen-best-expansion.js
            git commit -m "chore(content): normalize flagged boilerplate [skip ci]"
            git push origin HEAD:master
          fi

      - name: Content quality lint
        run: npm run lint:content

      - name: SEO content audit
        run: npm run seo:audit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
